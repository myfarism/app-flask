<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Absensi - Client Camera</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100">
    <div class="container mx-auto p-4 max-w-4xl">
        <div class="bg-white rounded-lg shadow-lg p-6">
            <h1 class="text-2xl font-bold mb-4 text-center">Absensi Wajah - Client Camera</h1>
            
            <!-- Video Preview -->
            <div class="relative mb-4">
                <video id="video" autoplay playsinline class="w-full rounded-lg border-4 border-blue-500"></video>
                <canvas id="canvas" class="hidden"></canvas>
            </div>

            <!-- Status -->
            <div id="status" class="mb-4 p-4 rounded-lg bg-gray-200 text-center">
                <p class="text-lg font-semibold">Menunggu...</p>
            </div>

            <!-- Controls -->
            <div class="flex gap-4 justify-center mb-4">
                <button id="startBtn" class="bg-blue-500 text-white px-6 py-2 rounded-lg hover:bg-blue-600">
                    Mulai Kamera
                </button>
                <button id="captureBtn" class="bg-green-500 text-white px-6 py-2 rounded-lg hover:bg-green-600 hidden">
                    Ambil Foto & Absen
                </button>
                <button id="stopBtn" class="bg-red-500 text-white px-6 py-2 rounded-lg hover:bg-red-600 hidden">
                    Stop Kamera
                </button>
            </div>

            <!-- Hasil Deteksi -->
            <div id="result" class="hidden p-4 rounded-lg mb-4"></div>

            <!-- Daftar Absensi Hari Ini -->
            <div class="mt-6">
                <h2 class="text-xl font-bold mb-2">Absensi Hari Ini</h2>
                <div id="attendanceList" class="bg-gray-50 rounded-lg p-4">
                    <p class="text-gray-500">Loading...</p>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/client-camera-script.js"></script>
</body>
</html>
